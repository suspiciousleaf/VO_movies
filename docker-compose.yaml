services:
  voflix:
    image: ${VOFLIX_IMAGE}
    container_name: voflix
#    build: .
    depends_on:
      - db
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:7980:7980"
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7980"]

  db:
    image: mysql:8.4
    container_name: mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"

volumes:
  db_data:
    external: true
    name: vo_movies_db_data
